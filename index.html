<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css" /> -->
  <!-- Theme: Simple -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --base-font-family: 'Noto Sans Thai', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --code-font-family: 'Fira Code', 'SFMono-Regular', Consolas, Menlo, monospace;
      --theme-color: #e00072;
      --theme-color-secondary: #4b1d9c;
      --base-text-color: #1f1a2b;
      --sidebar-width: 270px;
      --nav-offset: 96px;
    }

    body {
      color: var(--base-text-color);
    }

    body {
      scroll-padding-top: var(--nav-offset);
    }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section h5,
    .markdown-section h6,
    .markdown-section [id] {
      scroll-margin-top: var(--nav-offset);
    }
    .markdown-section [id]::before {
      content: '';
      display: block;
      height: var(--nav-offset);
      margin-top: calc(-1 * var(--nav-offset));
      visibility: hidden;
      pointer-events: none;
    }

    nav.app-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 20px rgba(39, 7, 104, 0.18);
      border-radius: 0;
      padding: 14px 18px;
      margin: 0;
      color: var(--base-text-color);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 64px;
    }

    @media (min-width: 768px) {
      nav.app-nav {
        width: 100%;
      }
    }
  </style>

</head>

<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'NipaMail API Documentation',
      themeable: {
        readyTransition: true, // default
        responsiveTables: true  // default
      },
      loadSidebar: true,
      loadNavbar: false,
      experimentals: {
        mermaid: true
      },
      autoHeader: true,
      subMaxLevel: 5
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>

  <!-- Recommended -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>

</body>

</html>
