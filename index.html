<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="32x32" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css" /> -->
  <!-- Theme: Simple -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      var storedTheme;

      try {
        storedTheme = localStorage.getItem('nipamail.theme');
      } catch (error) {
        storedTheme = null;
      }

      var theme = storedTheme || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    }());
  </script>
  <style>
    :root {
      --base-font-family: 'Noto Sans Thai', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --code-font-family: 'Fira Code', 'SFMono-Regular', Consolas, Menlo, monospace;
      --theme-color: #e00072;
      --theme-color-secondary: #4b1d9c;
      --base-text-color: #1f1a2b;
      --base-background-color: #ffffff;
      --page-background: #ffffff;
      --surface-color: rgba(255, 255, 255, 0.88);
      --surface-strong-color: #ffffff;
      --sidebar-background: linear-gradient(180deg, #fff7fb 0%, #ffffff 34%, #f6fbff 100%);
      --sidebar-border-color: rgba(75, 29, 156, 0.12);
      --sidebar-shadow: 10px 0 30px rgba(31, 26, 43, 0.04);
      --heading-border-color: rgba(75, 29, 156, 0.1);
      --muted-text-color: rgba(31, 26, 43, 0.58);
      --sidebar-link-color: rgba(31, 26, 43, 0.78);
      --subtle-link-color: rgba(31, 26, 43, 0.56);
      --input-background: rgba(255, 255, 255, 0.82);
      --input-border-color: rgba(75, 29, 156, 0.16);
      --focus-ring-color: rgba(224, 0, 114, 0.12);
      --nav-background: rgba(255, 255, 255, 0.9);
      --nav-shadow: 0 6px 20px rgba(39, 7, 104, 0.18);
      --active-background: linear-gradient(90deg, rgba(224, 0, 114, 0.12), rgba(75, 29, 156, 0.08));
      --active-border-color: rgba(224, 0, 114, 0.18);
      --hover-background: rgba(224, 0, 114, 0.06);
      --code-background: #f8f4fb;
      --code-text-color: #241b31;
      --table-border-color: rgba(75, 29, 156, 0.14);
      --table-header-background: rgba(75, 29, 156, 0.06);
      --table-row-background: rgba(255, 255, 255, 0.62);
      --table-row-alt-background: rgba(75, 29, 156, 0.035);
      --sidebar-width: 270px;
      --sidebar-min-width: 220px;
      --sidebar-max-width: 520px;
      --nav-offset: 96px;
      color-scheme: light;
    }

    :root[data-theme='dark'] {
      --theme-color: #ff70b8;
      --theme-color-secondary: #a79bff;
      --base-text-color: #f3f2f1;
      --base-background-color: #29292d;
      --page-background: #29292d;
      --surface-color: rgba(59, 59, 64, 0.92);
      --surface-strong-color: #424247;
      --sidebar-background: linear-gradient(180deg, #3f3e48 0%, #37373d 48%, #303136 100%);
      --sidebar-border-color: rgba(167, 155, 255, 0.2);
      --sidebar-shadow: 10px 0 30px rgba(20, 20, 24, 0.24);
      --heading-border-color: rgba(167, 155, 255, 0.18);
      --muted-text-color: rgba(243, 242, 241, 0.68);
      --sidebar-link-color: rgba(243, 242, 241, 0.86);
      --subtle-link-color: rgba(243, 242, 241, 0.62);
      --input-background: rgba(68, 68, 74, 0.94);
      --input-border-color: rgba(167, 155, 255, 0.24);
      --focus-ring-color: rgba(255, 112, 184, 0.22);
      --nav-background: rgba(49, 49, 54, 0.92);
      --nav-shadow: 0 8px 24px rgba(20, 20, 24, 0.22);
      --active-background: linear-gradient(90deg, rgba(98, 100, 167, 0.26), rgba(255, 112, 184, 0.15));
      --active-border-color: rgba(255, 112, 184, 0.32);
      --hover-background: rgba(98, 100, 167, 0.18);
      --code-background: #404046;
      --code-text-color: #fbf7fb;
      --table-border-color: rgba(167, 155, 255, 0.18);
      --table-header-background: rgba(98, 100, 167, 0.16);
      --table-row-background: rgba(62, 62, 68, 0.72);
      --table-row-alt-background: rgba(98, 100, 167, 0.09);
      color-scheme: dark;
    }

    body {
      background: var(--page-background);
      color: var(--base-text-color);
      transition: background 180ms ease, color 180ms ease;
    }

    body {
      scroll-padding-top: var(--nav-offset);
    }

    a {
      color: var(--theme-color);
    }

    .content,
    .markdown-section {
      background: transparent;
      color: var(--base-text-color);
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section strong {
      color: var(--base-text-color);
    }

    .markdown-section blockquote {
      border-left-color: var(--theme-color);
      color: var(--muted-text-color);
    }

    .markdown-section code,
    .markdown-section pre {
      background: var(--code-background);
      color: var(--code-text-color);
    }

    .markdown-section table {
      background: var(--table-row-background);
      color: var(--base-text-color);
    }

    .markdown-section th {
      background: var(--table-header-background);
      color: var(--base-text-color);
    }

    .markdown-section th,
    .markdown-section td {
      border-color: var(--table-border-color);
      color: var(--base-text-color);
    }

    .markdown-section tr {
      background: var(--table-row-background);
    }

    .markdown-section tr:nth-child(2n) {
      background: var(--table-row-alt-background);
    }

    .markdown-section hr {
      border-color: var(--table-border-color);
    }

    .anchor span {
      color: var(--base-text-color);
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section h5,
    .markdown-section h6,
    .markdown-section [id] {
      scroll-margin-top: var(--nav-offset);
    }
    .markdown-section [id]::before {
      content: '';
      display: block;
      height: var(--nav-offset);
      margin-top: calc(-1 * var(--nav-offset));
      visibility: hidden;
      pointer-events: none;
    }

    .sidebar {
      background: var(--sidebar-background);
      border-right: 1px solid var(--sidebar-border-color);
      box-shadow: var(--sidebar-shadow);
    }

    .sidebar h1 {
      margin: 0;
      padding: 28px 22px 18px;
      border-bottom: 1px solid var(--heading-border-color);
      color: var(--base-text-color);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .sidebar .search {
      background: transparent;
      margin: 16px 14px 8px;
      padding: 0;
      border: 0;
    }

    .sidebar .search input {
      min-height: 40px;
      border: 1px solid var(--input-border-color);
      border-radius: 8px;
      background: var(--input-background);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      color: var(--base-text-color);
      font-size: 14px;
    }

    .sidebar .search input::placeholder {
      color: var(--muted-text-color);
    }

    .sidebar .search input:focus {
      border-color: var(--theme-color);
      box-shadow: 0 0 0 3px var(--focus-ring-color);
    }

    .sidebar .search .input-wrap {
      background: transparent;
    }

    .sidebar-nav {
      padding: 8px 12px 32px;
    }

    .sidebar-nav ul {
      margin: 0;
      padding: 0;
    }

    .sidebar-nav li {
      margin: 0;
    }

    .sidebar-nav > ul > li {
      margin-top: 18px;
    }

    .sidebar-nav > ul > li:first-child {
      margin-top: 4px;
    }

    .sidebar-nav > ul > li > strong,
    .sidebar-nav > ul > li > p strong {
      display: block;
      padding: 0 10px 8px;
      color: var(--muted-text-color);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .sidebar-nav > ul > li > ul {
      display: grid;
      gap: 4px;
    }

    .sidebar-nav > ul > li > ul > li > a {
      display: block;
      padding: 9px 10px 9px 14px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--sidebar-link-color);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.35;
      text-decoration: none;
      overflow-wrap: anywhere;
      white-space: normal;
      word-break: break-word;
    }

    .sidebar-nav > ul > li > ul > li > a:hover {
      background: var(--hover-background);
      color: var(--theme-color);
    }

    .sidebar-nav > ul > li > ul > li.active > a,
    .sidebar-nav > ul > li > ul > li > a.active {
      border-color: var(--active-border-color);
      background: var(--active-background);
      color: var(--theme-color);
      font-weight: 700;
      box-shadow: inset 3px 0 0 var(--theme-color);
    }

    .sidebar-nav > ul > li > ul > li.active:has(.app-sub-sidebar li.active) > a {
      border-color: transparent;
      background: transparent;
      color: var(--sidebar-link-color);
      font-weight: 500;
      box-shadow: none;
    }

    .sidebar-nav .app-sub-sidebar {
      margin: 6px 0 8px 14px;
      padding-left: 10px;
      border-left: 3px solid var(--sidebar-border-color);
    }

    .sidebar-nav .app-sub-sidebar a {
      display: block;
      padding: 5px 8px;
      color: var(--subtle-link-color);
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
      white-space: normal;
      word-break: break-word;
    }

    .sidebar-nav .app-sub-sidebar a:hover {
      color: var(--theme-color-secondary);
    }

    .sidebar-nav .app-sub-sidebar li.active > a,
    .sidebar-nav .app-sub-sidebar a.active {
      border-radius: 6px;
      background: var(--active-background);
      color: var(--theme-color);
      font-weight: 700;
      box-shadow: inset 2px 0 0 var(--theme-color);
    }

    nav.app-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--nav-background);
      backdrop-filter: blur(8px);
      box-shadow: var(--nav-shadow);
      border-radius: 0;
      padding: 14px 18px;
      margin: 0;
      color: var(--base-text-color);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 64px;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      border: 1px solid var(--input-border-color);
      border-radius: 999px;
      background: var(--surface-color);
      color: var(--base-text-color);
      cursor: pointer;
      font-family: var(--base-font-family);
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      margin-left: 10px;
      padding: 0 14px;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .theme-toggle:hover {
      border-color: var(--theme-color);
      color: var(--theme-color);
      transform: translateY(-1px);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--theme-color);
      outline-offset: 2px;
    }

    .theme-toggle__icon {
      width: 12px;
      height: 12px;
      border: 2px solid currentColor;
      border-radius: 50%;
      background: var(--theme-color);
      box-shadow: inset -4px -2px 0 var(--surface-strong-color);
    }

    .theme-toggle__label {
      white-space: nowrap;
    }

    .theme-toggle--floating {
      position: fixed;
      top: 14px;
      right: 18px;
      z-index: 45;
    }

    .sidebar-toggle {
      background: var(--surface-color);
    }

    .sidebar-toggle span {
      background-color: var(--theme-color);
    }

    .app-name-link,
    .sidebar ul li a {
      color: var(--sidebar-link-color);
    }

    .search .matching-post {
      background: transparent;
      border-bottom-color: var(--table-border-color);
    }

    .search .matching-post h2,
    .search .matching-post p {
      color: var(--base-text-color);
    }

    .search .matching-post a {
      color: var(--theme-color);
    }

    .search .results-panel {
      background: var(--surface-strong-color);
      border-color: var(--table-border-color);
      color: var(--base-text-color);
    }

    .search .clear-button svg {
      transform: scale(0.82);
    }

    :root[data-theme='dark'] .sidebar .search,
    :root[data-theme='dark'] .sidebar .search input,
    :root[data-theme='dark'] .search input {
      background: var(--input-background) !important;
      color: var(--base-text-color) !important;
    }

    :root[data-theme='dark'] .sidebar .search {
      background: transparent !important;
    }

    :root[data-theme='dark'] .sidebar .search input,
    :root[data-theme='dark'] .search input {
      border-color: var(--input-border-color) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08) !important;
    }

    :root[data-theme='dark'] .search input::placeholder {
      color: var(--muted-text-color) !important;
    }

    :root[data-theme='dark'] .markdown-section table,
    :root[data-theme='dark'] .markdown-section thead,
    :root[data-theme='dark'] .markdown-section tbody {
      background: var(--table-row-background) !important;
      color: var(--base-text-color) !important;
    }

    :root[data-theme='dark'] .markdown-section tr {
      background: var(--table-row-background) !important;
    }

    :root[data-theme='dark'] .markdown-section tr:nth-child(2n) {
      background: var(--table-row-alt-background) !important;
    }

    :root[data-theme='dark'] .markdown-section th {
      background: var(--table-header-background) !important;
      color: var(--base-text-color) !important;
    }

    :root[data-theme='dark'] .markdown-section td {
      background: transparent !important;
      color: var(--base-text-color) !important;
    }

    :root[data-theme='dark'] .markdown-section th,
    :root[data-theme='dark'] .markdown-section td {
      border-color: var(--table-border-color) !important;
    }

    :root[data-theme='dark'] .markdown-section code,
    :root[data-theme='dark'] .markdown-section p code,
    :root[data-theme='dark'] .markdown-section li code,
    :root[data-theme='dark'] .markdown-section td code,
    :root[data-theme='dark'] .markdown-section th code,
    :root[data-theme='dark'] .markdown-section blockquote code {
      background: var(--code-background) !important;
      color: var(--code-text-color) !important;
      border-color: var(--table-border-color) !important;
    }

    :root[data-theme='dark'] .markdown-section pre,
    :root[data-theme='dark'] .markdown-section pre code,
    :root[data-theme='dark'] .markdown-section code[class*='lang-'],
    :root[data-theme='dark'] .markdown-section pre[class*='lang-'] {
      background: var(--code-background) !important;
      color: var(--code-text-color) !important;
    }

    :root[data-theme='dark'] img {
      filter: brightness(0.92) contrast(1.04);
    }

    :root[data-theme='dark'] .token.comment,
    :root[data-theme='dark'] .token.prolog,
    :root[data-theme='dark'] .token.doctype,
    :root[data-theme='dark'] .token.cdata {
      color: #bebbc7;
    }

    :root[data-theme='dark'] .token.punctuation {
      color: #ece9f1;
    }

    :root[data-theme='dark'] .token.property,
    :root[data-theme='dark'] .token.tag,
    :root[data-theme='dark'] .token.boolean,
    :root[data-theme='dark'] .token.number,
    :root[data-theme='dark'] .token.constant,
    :root[data-theme='dark'] .token.symbol,
    :root[data-theme='dark'] .token.variable {
      color: #ff9ccc;
    }

    :root[data-theme='dark'] .token.selector,
    :root[data-theme='dark'] .token.attr-name,
    :root[data-theme='dark'] .token.string,
    :root[data-theme='dark'] .token.char,
    :root[data-theme='dark'] .token.builtin {
      color: #c9c2ff;
    }

    :root[data-theme='dark'] .token.operator,
    :root[data-theme='dark'] .token.entity,
    :root[data-theme='dark'] .token.url,
    :root[data-theme='dark'] .language-css .token.string,
    :root[data-theme='dark'] .style .token.string {
      color: #ffbddb;
    }

    :root[data-theme='dark'] code[class*='language-json'] .token.property,
    :root[data-theme='dark'] pre[class*='language-json'] .token.property,
    :root[data-theme='dark'] code.lang-json .token.property,
    :root[data-theme='dark'] pre.lang-json .token.property {
      color: #ff8bc8;
      font-weight: 700;
    }

    :root[data-theme='dark'] code[class*='language-json'] .token.string,
    :root[data-theme='dark'] pre[class*='language-json'] .token.string,
    :root[data-theme='dark'] code.lang-json .token.string,
    :root[data-theme='dark'] pre.lang-json .token.string {
      color: #c8c1ff;
    }

    :root[data-theme='dark'] code[class*='language-json'] .token.number,
    :root[data-theme='dark'] pre[class*='language-json'] .token.number,
    :root[data-theme='dark'] code[class*='language-json'] .token.boolean,
    :root[data-theme='dark'] pre[class*='language-json'] .token.boolean,
    :root[data-theme='dark'] code[class*='language-json'] .token.null,
    :root[data-theme='dark'] pre[class*='language-json'] .token.null,
    :root[data-theme='dark'] code.lang-json .token.number,
    :root[data-theme='dark'] pre.lang-json .token.number,
    :root[data-theme='dark'] code.lang-json .token.boolean,
    :root[data-theme='dark'] pre.lang-json .token.boolean,
    :root[data-theme='dark'] code.lang-json .token.null,
    :root[data-theme='dark'] pre.lang-json .token.null {
      color: #ffe08a;
      font-weight: 700;
    }

    :root[data-theme='dark'] code[class*='language-json'] .token.punctuation,
    :root[data-theme='dark'] pre[class*='language-json'] .token.punctuation,
    :root[data-theme='dark'] code.lang-json .token.punctuation,
    :root[data-theme='dark'] pre.lang-json .token.punctuation {
      color: #f2eff7;
    }

    @media (min-width: 768px) {
      nav.app-nav {
        width: 100%;
      }

      .sidebar {
        width: var(--sidebar-width);
        min-width: var(--sidebar-min-width);
        max-width: var(--sidebar-max-width);
      }

      .content {
        left: var(--sidebar-width);
      }

      body.close .content {
        left: 0;
      }

      .sidebar-resizer {
        position: fixed;
        top: 0;
        bottom: 0;
        left: calc(var(--sidebar-width) - 4px);
        z-index: 40;
        width: 8px;
        cursor: col-resize;
        touch-action: none;
      }

      .sidebar-resizer:focus-visible {
        outline: 2px solid var(--theme-color);
        outline-offset: 2px;
      }

      .sidebar-resizer::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 3px;
        width: 2px;
        background: transparent;
        transition: background 160ms ease, box-shadow 160ms ease;
      }

      .sidebar-resizer:hover::before,
      body.sidebar-resizing .sidebar-resizer::before {
        background: var(--theme-color);
        box-shadow: 0 0 0 3px rgba(224, 0, 114, 0.12);
      }

      body.close .sidebar-resizer {
        display: none;
      }

      body.sidebar-resizing {
        cursor: col-resize;
        user-select: none;
      }
    }

    @media (max-width: 767px) {
      .sidebar-resizer {
        display: none;
      }
    }
  </style>

</head>

<body>
  <div id="app"></div>
  <script>
    (function () {
      var hash = window.location.hash.replace(/^#/, '');

      if (!hash || hash === '/') {
        window.location.replace(window.location.pathname + '#/th-th/');
      }
    }());

    window.$docsify = {
      name: 'NipaMail API Documentation',
      themeable: {
        readyTransition: true, // default
        responsiveTables: true  // default
      },
      loadSidebar: true,
      loadNavbar: true,
      experimentals: {
        mermaid: true
      },
      autoHeader: true,
      subMaxLevel: 5
    }
  </script>
  <script>
    (function () {
      function getCurrentDocsifyPath() {
        var hash = window.location.hash.replace(/^#/, '');
        var queryIndex = hash.indexOf('?');

        if (queryIndex !== -1) {
          hash = hash.slice(0, queryIndex);
        }

        return hash || '/';
      }

      function toEnglishPath(path) {
        var englishPath = path.replace(/^\/th-th(?=\/|$)/, '') || '/';

        if (englishPath === '/README.md') {
          return '/';
        }

        return englishPath;
      }

      function toThaiPath(path) {
        var englishPath = toEnglishPath(path);

        if (englishPath === '/') {
          return '/th-th/';
        }

        return '/th-th' + englishPath;
      }

      function updateLanguageLinks() {
        var nav = document.querySelector('nav.app-nav');
        var path = getCurrentDocsifyPath();
        var updated = false;

        if (!nav) {
          return false;
        }

        Array.prototype.forEach.call(nav.querySelectorAll('a'), function (link) {
          var label = link.textContent.trim();

          if (label.indexOf('English') !== -1) {
            link.setAttribute('href', '#' + toEnglishPath(path));
            updated = true;
          }

          if (label.indexOf('ภาษาไทย') !== -1) {
            link.setAttribute('href', '#' + toThaiPath(path));
            updated = true;
          }
        });

        return updated;
      }

      window.addEventListener('hashchange', function () {
        var attempts = 0;
        var navWatcher = window.setInterval(function () {
          attempts += 1;

          if (updateLanguageLinks() || attempts >= 20) {
            window.clearInterval(navWatcher);
          }
        }, 250);
      });

      window.addEventListener('DOMContentLoaded', function () {
        var attempts = 0;
        var navWatcher = window.setInterval(function () {
          attempts += 1;
          if (updateLanguageLinks() || attempts >= 20) {
            window.clearInterval(navWatcher);
          }
        }, 250);
      });
    }());
  </script>
  <script>

      function readStoredTheme() {
        try {
          return localStorage.getItem(storageKey);
        } catch (error) {
          return null;
        }
      }

      function storeTheme(theme) {
        try {
          localStorage.setItem(storageKey, theme);
        } catch (error) {
          return;
        }
      }

      function getTheme() {
        return root.getAttribute('data-theme') || 'dark';

            logo.dataset.lightSrc = logo.getAttribute('src');
          }

          if (isDark) {
            logo.setAttribute('src', darkLogoSrc);
            return;
          }

          if (logo.dataset.lightSrc) {
            logo.setAttribute('src', logo.dataset.lightSrc);
          }
        });
      }

      function scheduleLogoUpdate() {
        var attempts = 0;

        if (logoUpdateWatcher) {
          window.clearInterval(logoUpdateWatcher);
        }

        updateThemedLogos();

        logoUpdateWatcher = window.setInterval(function () {
          attempts += 1;
          updateThemedLogos();

          if (document.querySelector('.markdown-section img[alt="NipaMail Logo"], .markdown-section img[alt="NipaMail logo"]') || attempts >= 20) {
            window.clearInterval(logoUpdateWatcher);
            logoUpdateWatcher = null;
          }
        }, 250);
      }

      function setTheme(theme, shouldStore) {
        root.setAttribute('data-theme', theme);
        scheduleLogoUpdate();

        if (toggleButton) {
          var isDark = theme === 'dark';
          toggleButton.setAttribute('aria-pressed', String(isDark));
          toggleButton.querySelector('.theme-toggle__label').textContent = isDark ? 'Dark' : 'Light';
        }

        if (shouldStore) {
          storeTheme(theme);
        }
      }

      function placeThemeToggle() {
        var nav = document.querySelector('nav.app-nav');

        if (!toggleButton) {
          return false;
        }

        if (nav) {
          toggleButton.classList.remove('theme-toggle--floating');
          nav.appendChild(toggleButton);
          return true;
        }

        if (!document.documentElement.contains(toggleButton)) {
          toggleButton.classList.add('theme-toggle--floating');
          document.body.appendChild(toggleButton);
        }

        return false;
      }

      function watchThemeTogglePlacement() {
        var attempts = 0;

        if (placementWatcher) {
          window.clearInterval(placementWatcher);
        }

        placeThemeToggle();

        placementWatcher = window.setInterval(function () {
          attempts += 1;

          if (placeThemeToggle() || attempts >= 20) {
            window.clearInterval(placementWatcher);
            placementWatcher = null;
          }
        }, 250);
      }

      function addThemeToggle() {
        toggleButton = document.createElement('button');
        toggleButton.className = 'theme-toggle';
        toggleButton.type = 'button';
        toggleButton.setAttribute('aria-label', 'Toggle dark theme');
        toggleButton.innerHTML = '<span class="theme-toggle__icon" aria-hidden="true"></span><span class="theme-toggle__label"></span>';

        toggleButton.addEventListener('click', function () {
          setTheme(getTheme() === 'dark' ? 'light' : 'dark', true);
        });

        setTheme(getTheme(), false);
        watchThemeTogglePlacement();
      }

      window.addEventListener('DOMContentLoaded', function () {
        addThemeToggle();
        scheduleLogoUpdate();
      });
      window.addEventListener('hashchange', function () {
        watchThemeTogglePlacement();
        scheduleLogoUpdate();
      });
    }());
  </script>
  <script>
    (function () {
      var storageKey = 'nipamail.sidebarWidth';
      var root = document.documentElement;
      var mediaQuery = window.matchMedia('(min-width: 768px)');
      var minWidth = 220;
      var maxWidth = 520;
      var resizer;

      function clamp(value) {
        return Math.min(maxWidth, Math.max(minWidth, value));
      }

      function setSidebarWidth(value, shouldStore) {
        var width = clamp(value);
        root.style.setProperty('--sidebar-width', width + 'px');

        if (resizer) {
          resizer.setAttribute('aria-valuenow', String(width));
        }

        if (shouldStore) {
          localStorage.setItem(storageKey, String(width));
        }
      }

      function applyStoredWidth() {
        var storedWidth = parseInt(localStorage.getItem(storageKey), 10);

        if (Number.isFinite(storedWidth)) {
          setSidebarWidth(storedWidth, false);
        }
      }

      function addResizer() {
        if (resizer || !mediaQuery.matches) {
          return;
        }

        resizer = document.createElement('div');
        resizer.className = 'sidebar-resizer';
        resizer.setAttribute('role', 'separator');
        resizer.setAttribute('aria-label', 'Resize sidebar');
        resizer.setAttribute('aria-orientation', 'vertical');
        resizer.setAttribute('aria-valuemin', String(minWidth));
        resizer.setAttribute('aria-valuemax', String(maxWidth));
        resizer.setAttribute('aria-valuenow', String(parseInt(getComputedStyle(root).getPropertyValue('--sidebar-width'), 10)));
        resizer.tabIndex = 0;
        document.body.appendChild(resizer);

        resizer.addEventListener('pointerdown', function (event) {
          if (!mediaQuery.matches) {
            return;
          }

          event.preventDefault();
          document.body.classList.add('sidebar-resizing');
          resizer.setPointerCapture(event.pointerId);
        });

        resizer.addEventListener('pointermove', function (event) {
          if (!document.body.classList.contains('sidebar-resizing')) {
            return;
          }

          setSidebarWidth(event.clientX, true);
        });

        function stopResizing(event) {
          document.body.classList.remove('sidebar-resizing');

          if (event && resizer.hasPointerCapture(event.pointerId)) {
            resizer.releasePointerCapture(event.pointerId);
          }
        }

        resizer.addEventListener('pointerup', stopResizing);
        resizer.addEventListener('pointercancel', stopResizing);

        resizer.addEventListener('keydown', function (event) {
          var currentWidth = parseInt(getComputedStyle(root).getPropertyValue('--sidebar-width'), 10);
          var step = event.shiftKey ? 40 : 10;

          if (event.key === 'ArrowLeft') {
            event.preventDefault();
            setSidebarWidth(currentWidth - step, true);
          }

          if (event.key === 'ArrowRight') {
            event.preventDefault();
            setSidebarWidth(currentWidth + step, true);
          }
        });
      }

      applyStoredWidth();
      window.addEventListener('DOMContentLoaded', addResizer);
      mediaQuery.addEventListener('change', addResizer);
    }());
  </script>
  <script>
    (function () {
      function selectionTouchesCode(selection) {
        if (!selection || selection.rangeCount === 0) {
          return false;
        }

        for (var index = 0; index < selection.rangeCount; index += 1) {
          var range = selection.getRangeAt(index);
          var container = range.commonAncestorContainer;
          var element = container.nodeType === Node.ELEMENT_NODE ? container : container.parentElement;

          if (element && element.closest('.markdown-section pre, .markdown-section code')) {
            return true;
          }
        }

        return false;
      }

      document.addEventListener('copy', function (event) {
        var selection = window.getSelection();

        if (!selectionTouchesCode(selection)) {
          return;
        }

        event.preventDefault();
        event.clipboardData.setData('text/plain', selection.toString());
      });
    }());
  </script>
